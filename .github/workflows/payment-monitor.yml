name: Payment monitoring

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  payment-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check payment health
        env:
          MONITOR_URL: ${{ secrets.KEVESTA_MONITOR_URL }}
          MONITORING_SECRET: ${{ secrets.KEVESTA_MONITORING_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MONITOR_URL"
          test -n "$MONITORING_SECRET"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $MONITORING_SECRET" \
            "$MONITOR_URL/api/monitoring/health"
